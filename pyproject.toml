[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "degradation-aware-routing-ocr"
version = "0.1.0"
description = "Reproducible selective OCR/VLM routing baselines"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "scikit-learn==1.7.2", "scipy==1.15.3", "joblib==1.5.2", "threadpoolctl==3.6.0"]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.2"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
